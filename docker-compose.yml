---
services:
  redis:
    container_name: redis
    hostname: redis
    image: redis:8.10.3-alpine

  redis-commander:
    container_name: redis-commander
    hostname: redis-commander
    image: ghcr.io/dalton-hq/redis-commander:0.9.1.2
    build: .
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    user: redis
